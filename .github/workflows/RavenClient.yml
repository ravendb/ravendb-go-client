name: tests
on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 6'
jobs:
  build:
    name: Go ${{ matrix.go-version }} / RavenDB ${{ matrix.server-version }}
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 60

    strategy:
      matrix:
        go-version: [ oldstable, stable ]
        server-version: [ "6.2", "7.2" ]
        operating-system: [ ubuntu-latest ]
      fail-fast: false

    env:
      RAVEN_License: ${{ secrets.RAVEN_LICENSE }}
      RAVENDB_SERVER_PATH: ${{ github.workspace }}/RavenDB/Server/Raven.Server
      RAVENDB_SERVER_VERSION: ${{ matrix.server-version }}
      RAVENDB_TEST_CERTIFICATE_PATH: ${{ github.workspace }}/certs/server.pfx
      RAVENDB_TEST_CLIENT_CERTIFICATE_PATH: ${{ github.workspace }}/certs/go.pem
      RAVENDB_TEST_CA_PATH: /usr/local/share/ca-certificates/ca.crt
      RAVENDB_BUILD_TYPE: nightly

      VERBOSE_LOG: true
      LOG_FAILED_HTTP_REQUESTS: true
      LOG_ALL_REQUESTS: true
      LOG_FAILED_HTTP_REQUESTS_DELAYED: true

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download RavenDB Server
        run: wget -O RavenDB.tar.bz2 "https://hibernatingrhinos.com/downloads/RavenDB%20for%20Linux%20x64/latest?buildType=${{ env.RAVENDB_BUILD_TYPE }}&version=${{ matrix.server-version }}"

      - name: Generate test certificates
        run: |
          mkdir certs
          openssl genrsa -out certs/ca.key 4096
          openssl req -new -x509 -key certs/ca.key -out certs/ca.crt -subj "/C=US/ST=Arizona/L=Nevada/O=RavenDB Test CA/OU=RavenDB test CA/CN=localhost/emailAddress=ravendbca@example.com"
          openssl genrsa -out certs/localhost.key 4096
          openssl req -new -key certs/localhost.key -out certs/localhost.csr -subj "/C=US/ST=Arizona/L=Nevada/O=RavenDB Test/OU=RavenDB test/CN=localhost/emailAddress=ravendb@example.com"
          openssl x509 -req -extensions ext -extfile tests/cert/test_cert.conf -in certs/localhost.csr -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial -out certs/localhost.crt
          cat certs/localhost.key certs/localhost.crt > certs/go.pem
          openssl pkcs12 -passout pass:"" -export -out certs/server.pfx -inkey certs/localhost.key -in certs/localhost.crt
          sudo cp certs/ca.crt /usr/local/share/ca-certificates/ca.crt
          sudo update-ca-certificates

      - name: Extract RavenDB Server
        run: tar xjf RavenDB.tar.bz2

      - name: Deploy server certificate
        run: mkdir RavenDB/Server/certs && cp certs/server.pfx RavenDB/Server/certs/

      - name: Build package
        run: |
          go version
          go build

      - name: Run tests
        run: go test -tags for_tests -v -timeout 50m ./tests
